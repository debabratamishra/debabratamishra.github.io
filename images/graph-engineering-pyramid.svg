<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="100%" height="auto" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C3E50" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1A252F" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="specGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2980B9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1A5276" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="intentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27AE60" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1E8449" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="contextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F39C12" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E67E22" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="graphGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E74C3C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C0392B" stop-opacity="1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="580" fill="#F8F9FA" rx="10"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#2C3E50">Agent Engineering Pyramid</text>
  <text x="400" y="52" text-anchor="middle" font-size="11" fill="#7F8C8D">Graph Engineering as the topological foundation of multi-agent systems</text>

  <!-- Specification Layer (top) -->
  <polygon points="280,100 520,100 480,180 320,180" fill="url(#specGrad)" filter="url(#shadow)" opacity="0.92"/>
  <text x="400" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Specification Engineering</text>
  <text x="400" y="155" text-anchor="middle" font-size="9" fill="#D6EAF8">Policies &amp; standards</text>
  <text x="400" y="169" text-anchor="middle" font-size="8" fill="#AED6F1">Autonomous multi-agent operation at scale</text>

  <!-- Intent Layer -->
  <polygon points="225,195 575,195 530,275 270,275" fill="url(#intentGrad)" filter="url(#shadow)" opacity="0.92"/>
  <text x="400" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Intent Engineering</text>
  <text x="400" y="251" text-anchor="middle" font-size="9" fill="#D5F5E3">Goals, values, and trade-off hierarchies</text>
  <text x="400" y="265" text-anchor="middle" font-size="8" fill="#A9DFBF">Guides agent team behavior</text>

  <!-- Context Layer -->
  <polygon points="185,280 615,280 570,365 230,365" fill="url(#contextGrad)" filter="url(#shadow)" opacity="0.92"/>
  <text x="400" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Context Engineering</text>
  <text x="400" y="335" text-anchor="middle" font-size="9" fill="#FEF9E7">What the agent knows, sees, and remembers</text>
  <text x="400" y="349" text-anchor="middle" font-size="8" fill="#F9E79F">Retrieve, compose, format, and manage the context window</text>

  <!-- Graph Engineering Layer (base, highlighted) -->
  <polygon points="130,370 670,370 620,460 180,460" fill="url(#graphGrad)" filter="url(#shadow)" stroke="#A93226" stroke-width="1.5"/>
  <text x="400" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="white">★ Graph Engineering ★</text>
  <text x="400" y="422" text-anchor="middle" font-size="9" fill="#FADBD8">The topological layer that structures who the system is</text>
  <text x="400" y="438" text-anchor="middle" font-size="8" fill="#F5B7B1">Org Graph (stable structure) + Work Graph (dynamic task graph)</text>
  <text x="400" y="452" text-anchor="middle" font-size="8" fill="#F5B7B1">Controls: message paths, edge topology, governance, zone boundaries</text>

  <!-- Bottom: Prompt Engineering -->
  <polygon points="100,460 700,460 650,540 150,540" fill="url(#baseGrad)" filter="url(#shadow)" opacity="0.75"/>
  <text x="400" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Prompt Engineering</text>
  <text x="400" y="506" text-anchor="middle" font-size="9" fill="#FADBD8">Individual queries &amp; system instructions</text>
  <text x="400" y="520" text-anchor="middle" font-size="8" fill="#E6B0AA">Necessary but insufficient for complex multi-agent tasks</text>

  <!-- Arrow annotation -->
  <text x="400" y="545" text-anchor="middle" font-size="8" fill="#95A5A6">Each layer subsumes the prior as a necessary foundation</text>

  <!-- Legend -->
  <rect x="570" y="552" width="12" height="12" fill="#E74C3C" opacity="0.9" rx="2"/>
  <text x="588" y="564" font-size="8" fill="#7F8C8D">Graph Engineering (topological)</text>
  <rect x="570" y="568" width="12" height="12" fill="#2C3E50" opacity="0.75" rx="2"/>
  <text x="588" y="580" font-size="8" fill="#7F8C8D">Other layers (foundational)</text>
</svg>