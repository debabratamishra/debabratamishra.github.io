{% include base_path %}

<nav class="nav-pill" role="navigation" aria-label="Main navigation">
  <div class="nav-pill__logo">{{ site.title | slice: 0, 2 }}</div>
  <ul class="nav-pill__links">
    {% for link in site.data.navigation.main %}
      <li><a href="{{ link.url | relative_url }}">{{ link.title }}</a></li>
    {% endfor %}
  </ul>
  <a href="{{ base_path }}/feed.xml" class="nav-pill__feed" title="RSS Feed" aria-label="RSS Feed">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/>
    </svg>
  </a>
</nav>
